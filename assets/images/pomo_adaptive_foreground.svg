<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon Arc Gradient: Cyan to Violet to Magenta -->
    <linearGradient id="neonArcFg" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF00AA"/>
    </linearGradient>

    <!-- Core Diamond Gradient -->
    <linearGradient id="coreGradFg" x1="30%" y1="20%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#E0FFFF"/>
      <stop offset="45%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowFg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadowFg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00F0FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Scaled to 1.15 so that with Android's 16% launcher inset, the core fills the 72dp safe zone (~62dp) -->
  <g transform="translate(512 512) scale(1.15) translate(-512 -512)">
    <!-- 24-Hour Timeline Outer Calibration Dial -->
    <circle cx="512" cy="512" r="380" stroke="#253246" stroke-width="4" stroke-dasharray="6 14"/>

    <!-- Subtle Ambient Glow Behind Main Dial -->
    <circle cx="512" cy="512" r="310" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.2" filter="url(#glowFg)"/>

    <!-- Secondary Inner Track Ring -->
    <circle cx="512" cy="512" r="320" stroke="#161F2E" stroke-width="32" stroke-linecap="round"/>

    <!-- Primary Active Focus & Progress Arc (270 degrees sweep) -->
    <path d="M 512 192 A 320 320 0 1 1 192 512" 
          stroke="url(#neonArcFg)" 
          stroke-width="38" 
          stroke-linecap="round" 
          filter="url(#subtleShadowFg)"/>

    <!-- Precision Lap Markers -->
    <line x1="512" y1="130" x2="512" y2="160" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="864" y1="512" x2="894" y2="512" stroke="#A855F7" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="512" y1="864" x2="512" y2="894" stroke="#FF00AA" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/>

    <!-- Center Focal Chrono-Diamond -->
    <polygon points="512,308 676,512 512,716 348,512" 
             fill="#0E121B" 
             stroke="url(#neonArcFg)" 
             stroke-width="8" 
             stroke-linejoin="round"/>

    <!-- Inner Radiant Core Diamond -->
    <polygon points="512,352 640,512 512,672 384,512" 
             fill="url(#coreGradFg)" 
             stroke="#FFFFFF" 
             stroke-width="3" 
             stroke-linejoin="round" 
             opacity="0.95" 
             filter="url(#glowFg)"/>

    <!-- Center Time Nexus Dot -->
    <circle cx="512" cy="512" r="28" fill="#FFFFFF"/>
    <circle cx="512" cy="512" r="14" fill="#0A0C10"/>
  </g>
</svg>
